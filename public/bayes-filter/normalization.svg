<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" role="img" aria-labelledby="title desc" font-family="IBM Plex Sans, DejaVu Sans, sans-serif">
<title id="title">Normalization rescales scores without changing their ratio</title><desc id="desc">Two stacked bars share a vertical scale. Before eta, open 0.45 and closed 0.25 total 0.70 below the dashed 1.0 line. Multiplying both by 1/0.70 gives open 0.643 and closed 0.357 totaling 1. The ratio remains 9 to 5.</desc>
<style>@media (prefers-color-scheme: dark){[fill="#eff5f8"]{fill:#111c26}[stroke="#eff5f8"]{stroke:#111c26}[fill="#fbfdfe"]{fill:#0c1118}[stroke="#fbfdfe"]{stroke:#0c1118}[fill="#15232c"]{fill:#e6edf3}[stroke="#15232c"]{stroke:#e6edf3}[fill="#475e6a"]{fill:#9baebd}[stroke="#475e6a"]{stroke:#9baebd}[fill="#cad9df"]{fill:#324854}[stroke="#cad9df"]{stroke:#324854}[fill="#0a7d8f"]{fill:#34d6e8}[stroke="#0a7d8f"]{stroke:#34d6e8}[fill="#c9edf0"]{fill:#163f49}[stroke="#c9edf0"]{stroke:#163f49}[fill="#6b46c1"]{fill:#a78bfa}[stroke="#6b46c1"]{stroke:#a78bfa}[fill="#e8dff8"]{fill:#30234a}[stroke="#e8dff8"]{stroke:#30234a}[fill="#a93434"]{fill:#ff9992}[stroke="#a93434"]{stroke:#ff9992}[fill="#fbdcda"]{fill:#532f34}[stroke="#fbdcda"]{stroke:#532f34}[fill="#b07c08"]{fill:#fbbf24}[stroke="#b07c08"]{stroke:#fbbf24}}</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475e6a"/></marker>
</defs>
<rect x="0" y="0" width="840" height="500" rx="0" fill="#eff5f8" stroke="none"/>
<text x="28" y="36" fill="#15232c" font-size="25" text-anchor="start" font-weight="650">η stretches both scores by the same factor</text>
<text x="180" y="86" fill="#15232c" font-size="23" text-anchor="middle" font-weight="650">Before η</text>
<text x="650" y="86" fill="#15232c" font-size="23" text-anchor="middle" font-weight="650">After η</text>
<path d="M65 120 H790" fill="none" stroke="#475e6a" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
<text x="28" y="126" fill="#475e6a" font-size="18" text-anchor="start" font-weight="400">1.0</text>
<text x="420" y="171" fill="#0a7d8f" font-size="22" text-anchor="middle" font-weight="650">× η ≈ 1.429</text>
<path d="M315 210 H510" fill="none" stroke="#475e6a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="120" y="235.5" width="120" height="94.5" rx="0" fill="#c9edf0" stroke="#0a7d8f"/>
<text x="180" y="289.75" fill="#0a7d8f" font-size="22" text-anchor="middle" font-weight="650">0.450</text>
<rect x="120" y="183.0" width="120" height="52.5" rx="0" fill="#e8dff8" stroke="#6b46c1"/>
<text x="180" y="216.25" fill="#6b46c1" font-size="22" text-anchor="middle" font-weight="650">0.250</text>
<text x="180" y="360" fill="#15232c" font-size="21" text-anchor="middle" font-weight="650">Total = 0.70</text>
<rect x="590" y="195.0" width="120" height="135.0" rx="0" fill="#c9edf0" stroke="#0a7d8f"/>
<text x="650" y="269.5" fill="#0a7d8f" font-size="22" text-anchor="middle" font-weight="650">0.643</text>
<rect x="590" y="120.0" width="120" height="75.0" rx="0" fill="#e8dff8" stroke="#6b46c1"/>
<text x="650" y="164.5" fill="#6b46c1" font-size="22" text-anchor="middle" font-weight="650">0.357</text>
<text x="650" y="360" fill="#15232c" font-size="21" text-anchor="middle" font-weight="650">Total = 1.00</text>
<rect x="227" y="390" width="18" height="18" rx="0" fill="#c9edf0" stroke="#0a7d8f"/>
<text x="255" y="406" fill="#0a7d8f" font-size="19" text-anchor="start" font-weight="400">Open</text>
<rect x="457" y="390" width="18" height="18" rx="0" fill="#e8dff8" stroke="#6b46c1"/>
<text x="485" y="406" fill="#6b46c1" font-size="19" text-anchor="start" font-weight="400">Closed</text>
<text x="420" y="446" fill="#475e6a" font-size="20" text-anchor="middle" font-weight="400">0.45 : 0.25 = 9 : 5. Normalizing keeps that ratio.</text>
<text x="420" y="477" fill="#475e6a" font-size="20" text-anchor="middle" font-weight="400">Same relative evidence. New total: 100%.</text>
</svg>
