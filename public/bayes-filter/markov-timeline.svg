<text x="310" y="216" fill="#0a7d8f" font-size="25" text-anchor="middle" font-weight="650">xₜ₋₁</text>
<path d="M310 253 V289" fill="none" stroke="#475e6a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="262" y="292" width="96" height="46" rx="12" fill="#fbfdfe" stroke="#cad9df"/>
