<text x="640" y="97" fill="#475e6a" font-size="25" text-anchor="middle" font-weight="650">uₜ</text>
<path d="M640 114 L723 177" fill="none" stroke="#475e6a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
<g opacity="0.4">
<path d="M134 208 H265" fill="none" stroke="#475e6a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="90" cy="208" r="44" fill="#fbfdfe" stroke="#cad9df" stroke-width="2"/>
<text x="90" y="216" fill="#475e6a" font-size="25" text-anchor="middle" font-weight="650">xₜ₋₂</text>
