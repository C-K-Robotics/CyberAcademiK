<rect x="42" y="292" width="96" height="46" rx="12" fill="#fbfdfe" stroke="#cad9df"/>
<text x="90" y="323" fill="#475e6a" font-size="24" text-anchor="middle" font-weight="650">zₜ₋₂</text>
