<rect x="482" y="292" width="96" height="46" rx="12" fill="#e8dff8" stroke="#6b46c1"/>
<text x="530" y="323" fill="#6b46c1" font-size="24" text-anchor="middle" font-weight="650">zₜ</text>
</g>
<g opacity="1">
<circle cx="750" cy="208" r="44" fill="#fbfdfe" stroke="#cad9df" stroke-width="2"/>
<text x="750" y="216" fill="#475e6a" font-size="25" text-anchor="middle" font-weight="650">xₜ₊₁</text>
<path d="M750 253 V289" fill="none" stroke="#475e6a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="702" y="292" width="96" height="46" rx="12" fill="#fbfdfe" stroke="#cad9df"/>
<text x="750" y="323" fill="#475e6a" font-size="24" text-anchor="middle" font-weight="650">zₜ₊₁</text>
</g>
<text x="420" y="380" fill="#15232c" font-size="21" text-anchor="middle" font-weight="650">Predict xₜ from xₜ₋₁ and uₜ₋₁; then use measurement zₜ.</text>
<text x="420" y="413" fill="#475e6a" font-size="19" text-anchor="middle" font-weight="400">uₜ starts at xₜ and leads toward xₜ₊₁ — not backward into xₜ.</text>
<text x="420" y="449" fill="#475e6a" font-size="19" text-anchor="middle" font-weight="400">The filter carries bel(xₜ₋₁), because the true state is still unknown.</text>
</svg>
