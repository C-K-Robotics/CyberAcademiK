name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

# A scheduled run and a manual dispatch both push to the same `openwiki/update`
# branch; let the newer one win instead of racing over the branch.
concurrency:
  group: openwiki-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    # Scheduled workflows keep running in forks, which have no OPENROUTER_API_KEY —
    # the job could only fail there, daily. Manual dispatch still works anywhere.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository_owner == 'C-K-Robotics' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.3.2 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: z-ai/glm-5.2

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # Deliberately NOT including .github/workflows/** — the default
          # GITHUB_TOKEN has no `workflows` scope, so a commit touching a workflow
          # file is rejected and the whole step fails.
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow. Note that PRs
            opened with the default `GITHUB_TOKEN` do not trigger other workflows,
            so PR CI will not run here — close and reopen the PR if you want it.
